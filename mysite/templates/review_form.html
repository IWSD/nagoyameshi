<!DOCTYPE html>
{% extends "base.html" %}
{% block title %}レビュー投稿{% endblock %}
{% block content %}
<div class="container mt-4">
  <h2>レビューを投稿</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">投稿する</button>
  </form>
</div>
{% endblock %}
