<!DOCTYPE html>
{% load static %}

<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>

    <!-- Bootstrap -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
        crossorigin="anonymous">

    <!-- 自作CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary" style="margin-bottom: 1rem;">
      <div class="container-fluid">

          <div class="collapse navbar-collapse" id="navbarNav">
              <ul class="navbar-nav ms-auto">

                  {% if request.user.is_authenticated %}
                      <span class="navbar-text me-3">
                          ようこそ {{ user.get_username }} さん
                      </span>

                      <li class="nav-item">
                          <a class="nav-link" href="{% url 'mypage' %}">マイページ</a>
                      </li>

                      <li class="nav-item">
                          <form action="{% url 'logout' %}" method="post">
                              {% csrf_token %}
                              <input class="nav-link" type="submit" value="ログアウト">
                          </form>
                      </li>

                  {% else %}
                      <li class="nav-item">
                          <a class="nav-link" href="{% url 'login' %}">ログイン</a>
                      </li>

                      <!-- 🔽 新規登録リンク 追加 -->
                      <li class="nav-item">
                          <a class="nav-link" href="{% url 'register' %}">新規登録</a>
                      </li>
                  {% endif %}

              </ul>
          </div>

      </div>
  </nav>


  <div class="container">
      {% block content %}{% endblock %}
  </div>

  <!-- Bootstrap JS -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous">
  </script>
</body>
</html>
